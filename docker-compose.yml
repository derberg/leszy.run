name: leszyrun

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leszyrun
      POSTGRES_USER: leszyrun
      POSTGRES_PASSWORD: leszyrun
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leszyrun"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://leszyrun:leszyrun@db:5432/leszyrun
      MQTT_URL: mqtt://host.docker.internal:1883
      PORT: 3001
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SMSAPI_TOKEN: ${SMSAPI_TOKEN:-}
      SMSAPI_SENDER: ${SMSAPI_SENDER:-LeszyRun}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-biuro@zatyrani.pl}
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ./backend/src
          target: /app/backend/src

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:3001
      VITE_WS_URL: ws://localhost:3001
    depends_on:
      - backend
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: rebuild
          path: ./frontend/package.json

  searxng:
    image: searxng/searxng:latest
    container_name: leszyrun-searxng
    ports:
      - "8888:8080"
    volumes:
      - ./enricher/searxng-settings.yml:/etc/searxng/settings.yml:ro
      - searxng-data:/etc/searxng
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: scheduler/Dockerfile
    environment:
      TZ: Europe/Warsaw
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-biuro@zatyrani.pl}
      PIPELINE_ALERT_EMAIL: ${PIPELINE_ALERT_EMAIL:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      LOG_DIR: /app/logs
      COMPOSE_DIR: /workspace
    volumes:
      # docker socket so the scheduler can shell out to sibling services
      - /var/run/docker.sock:/var/run/docker.sock
      # mount compose context so `docker compose exec/run` resolves services
      - ./docker-compose.yml:/workspace/docker-compose.yml:ro
      - ./.env:/workspace/.env:ro
      # writable: pipeline log + heartbeat
      - ./logs:/app/logs
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  enricher:
    build:
      context: .
      dockerfile: enricher/Dockerfile
    environment:
      TZ: Europe/Warsaw
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: gemma3:27b
      SEARXNG_URL: http://searxng:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - searxng
    profiles: [run-once]

volumes:
  pgdata:
  searxng-data:
