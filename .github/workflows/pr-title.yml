name: PR title

# Every pull request is squash-merged, so its title becomes the commit on main.
# It must follow Conventional Commits; the rule is backend/scripts/lib/conventionalTitle.js.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  conventional-title:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check the title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node backend/scripts/check-pr-title.js
