name: Registration tests

on:
  pull_request:

permissions:
  contents: read

# Unit tests run on every pull request. The Supabase-backed suites run only when
# the pull request touches something they can reach (`changes` below), and split
# into the integration suite and three Playwright shards, each on its own stack,
# so they run side by side instead of one after the other.
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      registration: ${{ steps.diff.outputs.registration }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # The suites skip a pull request ONLY when every changed file is under a
      # path they cannot reach. An ignore list, not an allow list: a new
      # directory runs the suites until someone decides it cannot affect them.
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE" "$HEAD")
          printf '%s\n' "$changed"
          other=$(printf '%s\n' "$changed" | grep -vE '^(docs/|enricher/|vision/|frontend/|checkpoint-agent/|scheduler/|mosquitto/|\.claude/|backend/src/scrapers/|backend/scripts/)|\.md$' || true)
          if [ -n "$other" ]; then echo "registration=true" >> "$GITHUB_OUTPUT"; else echo "registration=false" >> "$GITHUB_OUTPUT"; fi

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - run: npm ci

      - name: Backend tests
        run: npm test --workspace=backend

      - name: Public unit tests
        run: npm run test:unit --prefix public

  integration:
    needs: changes
    if: needs.changes.outputs.registration == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read # authenticated ghcr.io pulls (see the login step)
    # The scratch timing host for tests/registration/helpers/hostPull.js: the backend's
    # pullConfig() runs against it, never against a real database.
    services:
      scratch-host:
        image: postgres:16
        env:
          POSTGRES_USER: leszyrun
          POSTGRES_PASSWORD: leszyrun
          POSTGRES_DB: leszyrun
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U leszyrun"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # setup-cli points the CLI at ghcr.io (SUPABASE_INTERNAL_IMAGE_REGISTRY). Anonymous pulls
      # there share a rate limit across runners ("toomanyrequests"); logged in, they do not.
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/registration-stack

      - name: Registration integration tests
        run: node --test --test-concurrency=1 "tests/registration/**/*.test.js"

      - name: Functions log on failure
        if: failure()
        run: tail -n 200 functions.log || true

  e2e:
    needs: changes
    if: needs.changes.outputs.registration == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Three e2e specs start a scratch timing host too.
    services:
      scratch-host:
        image: postgres:16
        env:
          POSTGRES_USER: leszyrun
          POSTGRES_PASSWORD: leszyrun
          POSTGRES_DB: leszyrun
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U leszyrun"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/registration-stack

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Registration Playwright tests (shard ${{ matrix.shard }}/3)
        run: npx playwright test -c tests/registration/playwright.config.js --pass-with-no-tests --shard=${{ matrix.shard }}/3

      - name: Functions log on failure
        if: failure()
        run: tail -n 200 functions.log || true
