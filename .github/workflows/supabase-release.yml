name: Supabase Release

# Applies committed migrations and deploys edge functions to the single
# production Supabase project on every push to main, then runs the edge-function
# integration tests as a post-deploy smoke check. No approval gate — PR review
# before merge is the control (see docs/supabase-release-runbook.md).
#
# Prerequisites (one-time, done by the operator — see the runbook):
#   1. Baseline migration committed (`supabase db pull`), so `db push` is a no-op
#      until a real new migration lands.
#   2. Repo secrets set: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD,
#      SUPABASE_PROJECT_REF, VITE_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY.

on:
  push:
    branches: [main]

# Never run two releases at once — serialize db push / deploy so quick
# back-to-back merges don't race. Do not cancel an in-flight release midway.
concurrency:
  group: supabase-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.109.1

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Apply migrations (db push)
        run: supabase db push
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy edge functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Advisory only — does NOT fail the release. The integration suite has
      # pre-existing tests that require a pre-seeded admin (ADMIN_USER_IDS) and
      # can't pass in CI; we don't want that to block deploys/merges. Deploy
      # steps above are the real gate. Revisit once clubs adds a simple,
      # prod-safe create/remove smoke.
      - name: Smoke test (advisory — non-blocking)
        continue-on-error: true
        run: node supabase/functions/tests/sweep.js && node --test supabase/functions/tests/*.test.js
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
