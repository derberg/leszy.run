[project]
name = "leszyrun-vision"
version = "0.1.0"
requires-python = ">=3.11"
# The version floor on mediapipe is a ceiling in disguise. 1.0.x aborts on
# macOS arm64: the object detector asks for a Metal GPU service that is not
# there and calls Check failed. 0.10.21 works, and it requires numpy<2, which
# is why opencv is held on the 4.x line.
dependencies = [
    "pillow>=10.0",
    "numpy>=1.26,<2",
    "opencv-python-headless>=4.9,<5",
    "onnxruntime>=1.17",
    "mediapipe==0.10.21",
    "click>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Training only, and only on a workstation. The Pi never needs these.
train = ["torch>=2.2", "onnxscript>=0.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning:vision.*",
    # protobuf ships a Python 3.14 deprecation that mediapipe pulls in. Not
    # ours to fix, and it would otherwise be the only noise in the run.
    "ignore:Type google._upb._message.*:DeprecationWarning",
]

[tool.setuptools.packages.find]
include = ["vision*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
