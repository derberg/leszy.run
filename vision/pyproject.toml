[project]
name = "leszyrun-vision"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "onnxruntime>=1.17",
    "mediapipe>=0.10",
    "click>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["vision*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
