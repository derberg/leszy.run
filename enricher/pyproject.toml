[project]
name = "leszyrun-enricher"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "crawl4ai>=0.8.0",
    "docling>=2.70.0",
    "pypdf>=5.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "supabase>=2.0.0",
    "click>=8.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
