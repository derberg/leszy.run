# MQTT listener (for Impinj R700 and other clients)
listener 1883
allow_anonymous true

# WebSocket listener (for browser-based dashboards / debugging)
listener 9001
protocol websockets
allow_anonymous true

# Persistence - survives broker restarts
persistence true
persistence_location mosquitto/data/

# Performance — high-throughput RFID events
max_inflight_messages 0
max_queued_messages 0

# Logging
log_dest stdout
log_dest file mosquitto/log/mosquitto.log
log_type all
