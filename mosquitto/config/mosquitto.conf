# MQTT listener (for Impinj R700 and other clients)
listener 1883
allow_anonymous true

# WebSocket listener (for browser-based dashboards / debugging)
listener 9001
protocol websockets
allow_anonymous true

# Persistence - survives broker restarts
persistence true
persistence_location mosquitto/data/

# Performance — high-throughput RFID events
# NOTE: must be an explicit value, not 0. With 0, mosquitto still grants MQTT 3.1.1
# publishers (the R700 connects as protocol v4) the default incoming receive quota
# of 20, flooding the log with "exceeded its receive-maximum quota" warnings under
# race-rate event streams. Verified on mosquitto 2.1.2, 2026-07-29.
max_inflight_messages 1000
max_queued_messages 0

# Logging
log_dest stdout
log_dest file mosquitto/log/mosquitto.log
log_type all
